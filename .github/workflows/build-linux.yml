name: Build Linux

# Vérifie que l'application compile sous Linux et produit les paquets .deb,
# .rpm et .AppImage. Déclenchable à la main ; se lance aussi sur un tag v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Dépendances système de Tauri v2. webkit2gtk-4.1 est la version attendue
      # par Tauri 2 (la 4.0 est celle de Tauri 1) ; patchelf est requis par le
      # bundler AppImage ; rpm fournit rpmbuild, absent d'ubuntu-latest, sans
      # lequel le paquet .rpm n'est pas produit.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            rpm \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build
        # Les artefacts d'updater exigent TAURI_SIGNING_PRIVATE_KEY ; ce job verifie
        # la compilation et produit les paquets, il n'a pas a signer une mise a jour.
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check the three packages exist
        run: |
          for pat in '*.deb' '*.rpm' '*.AppImage'; do
            f=$(find src-tauri/target/release/bundle -type f -name "$pat" | head -n1)
            if [ -z "$f" ]; then echo "::error::paquet $pat absent"; exit 1; fi
            echo "$f"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
